spring.application.name=sistema-aluguel-carros
server.port=${SERVER_PORT:8088}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:54322/postgres?sslmode=disable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_LOCAL_DB_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.datatype.datetime.WRITE_DATES_AS_TIMESTAMPS=false
app.auth.agent-invite-code=${AGENT_INVITE_CODE:}
app.auth.session-hours=${SESSION_HOURS:12}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://chat.maritaca.ai/api}
app.ai.openai.model=${OPENAI_MODEL:sabiazinho-4}
app.ai.openai.api-key=${OPENAI_API_KEY:${MARITACA_API_KEY:${APIKEY:}}}
app.ai.openai.max-tokens=${OPENAI_MAX_TOKENS:900}
